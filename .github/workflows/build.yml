name: Compilar (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Caché de JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}

      - name: Configurar con CMake
        run: cmake -S . -B build -A x64

      - name: Compilar en Release
        run: cmake --build build --config Release --parallel

      - name: Ejecutar los tests unitarios
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Subir el plugin VST3
        uses: actions/upload-artifact@v4
        with:
          name: P.ChordAnalyzer-VST3
          path: build/PChordAnalyzer_artefacts/Release/VST3/PChordAnalyzer.vst3

      - name: Subir la aplicación Standalone
        uses: actions/upload-artifact@v4
        with:
          name: P.ChordAnalyzer-Standalone
          path: build/PChordAnalyzer_artefacts/Release/Standalone/PChordAnalyzer.exe
